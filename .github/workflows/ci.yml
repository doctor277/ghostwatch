name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} - tests and quality
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

  browser-tests:
    name: Browser tests - synthetic Chromium
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GHOSTWATCH_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $files = @(
            "frontend/js/charts.js"
            "frontend/js/dashboard.js"
            "frontend/js/demo.js"
            "frontend/js/network-graph.js"
            "frontend/js/websocket.js"
            "e2e/dashboard.spec.js"
            "e2e/synthetic-backend.js"
            "e2e/telemetry-freshness.spec.js"
            "playwright.config.js"
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run synthetic Playwright tests
        run: npm run test:e2e
