[project]
name = "ghostwatch"
version = "3.0.0rc5"
description = "Local-first Windows cyber defense monitoring workstation"
requires-python = ">=3.11"
authors = [{ name = "Rafi Dahoui" }]
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".tmp", "data", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
